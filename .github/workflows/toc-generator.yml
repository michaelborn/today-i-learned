name: Update Table of Contents

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Sceleratis/markdown-table-of-contents-generator-action@v1.0.4
        with:
          table-file: README.md
          root-path: .
          exclude-root: false
          file-extension: md
          primary-file-name: README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "docs: update table of contents"
            git push
          fi
